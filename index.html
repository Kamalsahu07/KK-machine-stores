<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K.K. Machinery Stores, Workshop & Heera Agro | Rajim</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #dc2626;
            --primary-dark: #991b1b;
            --gold: #f59e0b;
            --gold-light: #fef08a;
            --dark-navy: #090d16;
            --dark-card: #111827;
            --light-bg: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --whatsapp-green: #22c55e;
            --upi-purple: #7c3aed;
            --heera-orange: #ea580c;
            --shadow-sm: 0 4px 6px -1px rgba(0,0,0,0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Tiro Devanagari Hindi', sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Top Announcement Strip */
        .offer-top-strip {
            background: linear-gradient(90deg, #991b1b, #d97706, #991b1b);
            color: #ffffff;
            padding: 7px 15px;
            font-size: 0.88rem;
            font-weight: 700;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.3px;
        }

        /* Navigation Bar */
        .nav-bar {
            background: rgba(9, 13, 22, 0.96);
            backdrop-filter: blur(10px);
            color: #ffffff;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.15rem;
            color: #ffffff;
            text-decoration: none;
        }

        .nav-brand img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            object-fit: cover;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lang-switch {
            display: flex;
            background: #1e293b;
            padding: 2px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 4px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.78rem;
            transition: all 0.3s;
        }

        .lang-btn.active {
            background: var(--primary);
            color: #ffffff;
        }

        .btn-nav-auth {
            background: rgba(255,255,255,0.12);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.25);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s;
        }

        .btn-nav-auth:hover {
            background: var(--gold);
            color: var(--dark-navy);
            border-color: var(--gold);
        }

        /* Hero / Header Section */
        header {
            background: radial-gradient(circle at top center, #2e0808 0%, #150303 50%, #090d16 100%);
            color: white;
            padding: 35px 20px 45px;
            text-align: center;
            position: relative;
            box-shadow: var(--shadow-lg);
            border-bottom: 4px solid var(--gold);
        }

        /* DP / Profile Picture with Live Edit */
        .dp-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 18px;
        }

        .shop-dp {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid var(--gold);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            background: #ffffff;
            cursor: pointer;
        }

        .shop-dp img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .dp-edit-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: var(--primary);
            color: white;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            border: 2px solid white;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .dp-edit-badge:hover {
            transform: scale(1.1);
        }

        header h1 {
            font-size: 2.3rem;
            color: #ffffff;
            font-weight: 900;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        header .tagline {
            font-size: 1.05rem;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 18px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-badges {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .badge {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.18);
            backdrop-filter: blur(5px);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .badge-heera {
            background: rgba(234, 88, 12, 0.2);
            border-color: #ea580c;
            color: #fed7aa;
        }

        .contact-cta-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.92rem;
            color: white;
            transition: all 0.25s ease;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
        }

        .btn-call { background: #0284c7; }
        .btn-whatsapp { background: var(--whatsapp-green); }
        .btn-maps { background: #ea4335; }
        .btn-add { background: #16a34a; }
        .btn-request { background: #ea580c; }
        .btn-pay { background: var(--upi-purple); }
        .btn-poster { background: #6366f1; }
        .btn-rules { background: #0284c7; }

        /* Container */
        .container {
            max-width: 1140px;
            margin: 25px auto;
            padding: 0 18px;
        }

        /* Poster Slider */
        .poster-slider-section {
            margin: 10px 0 35px;
            position: relative;
        }

        .slider-wrapper {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            border: 2px solid rgba(245, 158, 11, 0.3);
            background: #000;
        }

        .slide-item {
            display: none;
            position: relative;
            width: 100%;
            height: 380px;
        }

        .slide-item.active {
            display: block;
        }

        .slide-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.9);
        }

        .slide-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 30px 25px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
            color: white;
        }

        .slide-caption h3 {
            font-size: 1.5rem;
            color: var(--gold);
            font-weight: 800;
            margin-bottom: 4px;
        }

        .slide-caption p {
            font-size: 0.95rem;
            color: #f1f5f9;
        }

        .slider-controls {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            pointer-events: none;
        }

        .slide-btn {
            pointer-events: auto;
            background: rgba(15, 23, 42, 0.75);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .slide-btn:hover {
            background: var(--primary);
        }

        .poster-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .poster-header-bar h3 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--dark-navy);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Policy Banner */
        .policy-banner {
            background: linear-gradient(135deg, #1e1b4b 0%, #311042 100%);
            color: white;
            border-radius: 18px;
            padding: 24px;
            margin: 20px 0 35px;
            box-shadow: var(--shadow-lg);
            border: 2px solid #818cf8;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .policy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .policy-header h3 {
            font-size: 1.35rem;
            color: var(--gold-light);
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .slab-table-wrap {
            overflow-x: auto;
        }

        .slab-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            text-align: left;
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            overflow: hidden;
        }

        .slab-table th, .slab-table td {
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .slab-table th {
            background: rgba(0,0,0,0.4);
            color: var(--gold);
            font-weight: 800;
        }

        .rules-badge-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 5px;
        }

        .rule-chip {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.83rem;
            font-weight: 700;
        }

        .rule-chip.warning {
            background: rgba(245, 158, 11, 0.2);
            border-color: #f59e0b;
            color: #fef08a;
        }

        /* Section Headers */
        .section-header {
            text-align: center;
            margin: 45px 0 25px;
        }

        .section-header h2 {
            font-size: 1.8rem;
            color: var(--dark-navy);
            font-weight: 800;
            position: relative;
            display: inline-block;
        }

        .section-header h2::after {
            content: '';
            display: block;
            width: 50%;
            height: 4px;
            background: var(--primary);
            margin: 6px auto 0;
            border-radius: 2px;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        /* Services Grid */
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .service-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
            border-top: 5px solid var(--primary);
            transition: all 0.3s ease;
            position: relative;
        }

        .service-card.card-heera {
            border-top-color: var(--heera-orange);
            background: #fffdfa;
        }

        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .card-icon {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 14px;
        }

        .card-icon.icon-heera {
            color: var(--heera-orange);
        }

        .service-card h3 {
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: var(--dark-navy);
            font-weight: 800;
        }

        .service-card ul {
            list-style: none;
            padding-left: 0;
        }

        .service-card ul li {
            padding: 5px 0;
            color: #475569;
            font-size: 0.92rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .service-card ul li i {
            color: var(--primary);
            font-size: 0.85rem;
        }

        .service-card.card-heera ul li i {
            color: var(--heera-orange);
        }

        /* Search & Catalog Controls */
        .catalog-controls {
            background: #ffffff;
            padding: 18px 20px;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid #e2e8f0;
        }

        .search-box-row {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
        }

        .search-input-wrap {
            position: relative;
            flex-grow: 1;
        }

        .search-input-wrap i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .search-input-wrap input {
            width: 100%;
            padding: 12px 16px 12px 45px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .search-input-wrap input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
        }

        .filter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 7px 16px;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
            gap: 22px;
        }

        .product-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            border: 1px solid #e2e8f0;
            transition: transform 0.25s, box-shadow 0.25s;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .product-img-wrap {
            width: 100%;
            height: 200px;
            background: #f8fafc;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .product-card:hover .product-img-wrap img {
            transform: scale(1.04);
        }

        .prod-category-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(9, 13, 22, 0.88);
            color: var(--gold);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 11px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
        }

        .prod-offer-badge {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: var(--offer-badge);
            color: white;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 4px 9px;
            border-radius: 8px;
            text-transform: uppercase;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .product-info {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--dark-navy);
            margin-bottom: 4px;
        }

        .product-desc {
            color: #64748b;
            font-size: 0.86rem;
            margin-bottom: 12px;
            flex-grow: 1;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom:
